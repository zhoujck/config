name: config 接口

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
     TZ: Asia/Shanghai

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout iptv
        uses: actions/checkout@v5
        with:
          repository: zhoujck/iptv
          path: iptv
          sparse-checkout: live.txt
          sparse-checkout-cone-mode: false

      - name: Delete workflows
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.x

      - name: build
        run: |
          cd tools/
          pip install demjson3 requests==2.31.0 pycryptodome
          python build.py
          cd ../
          mkdir -p ext
          cp -p iptv/live.txt ./ext/live.txt
          rm -rf iptv
        shell: bash

      - name: 提交更改
        id: commit
        run: |
          git config user.email "zhoujck@live.com"
          git config user.name "zhoujck"
          git add .
          if ! git diff-index --quiet HEAD --; then
            git commit -m "更新JAR $(date +%Y%m%d%H%M)"
            git diff --name-only HEAD^ HEAD > "$RUNNER_TEMP/changed_files.txt"
            git push -f origin main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "没有文件更新，不执行 git push"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 清理 jsDelivr 缓存
        if: steps.commit.outputs.pushed == 'true'
        run: |
          python3 - <<'PY'
          import os, urllib.parse, urllib.request

          def purge(path):
              url = "https://purge.jsdelivr.net/gh/zhoujck/config@main/" + urllib.parse.quote(path)
              try:
                  with urllib.request.urlopen(url, timeout=30) as r:
                      print(f"[{r.status}] {path}")
              except Exception as e:
                  print(f"[ERR] {path}: {e}")

          # 入口配置必清
          purge("box")

          # 本次更新变更过的文件逐个清理
          p = os.path.join(os.environ.get("RUNNER_TEMP", "/tmp"), "changed_files.txt")
          if os.path.exists(p):
              for line in open(p, encoding="utf-8"):
                  f = line.strip()
                  if f and f != "box" and not f.startswith(".github/"):
                      purge(f)
          PY
